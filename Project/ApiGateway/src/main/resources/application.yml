server:
  port: 8080 # Сделаем Gateway точкой входа на порт 8080

# Настройки JWT (должны совпадать с Auth Service)
jwt:
  secret: bXlzdXBlcnNlY3JldGtleWZvcnRlc3RpbmcyMzQyMzRrbmpzbGRmampzZGxrbmpzZGY

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        -
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/auth/**
            -
        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/users/**, /api/cards/**
          filters:
            - name: SecurityGlobal

        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/api/orders/**
          filters:
            - name: SecurityGlobal

spring.security.enabled: false